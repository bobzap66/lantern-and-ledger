name: Respect uncertain vignette dates

on:
  push:
    paths:
      - '.github/workflows/respect-uncertain-vignette-dates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Respect uncertain vignette dates
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('quartz/plugins/transformers/vignetteIndexes.ts')
          text = index_path.read_text(encoding='utf-8')
          old = '''function dateText(frontmatter: Record<string, any>, fallbackPath: string) {
            const raw = String(frontmatter?.date ?? "").trim()'''
          new = '''function dateText(frontmatter: Record<string, any>, fallbackPath: string) {
            if (String(frontmatter?.date_status ?? "").toLowerCase() === "uncertain") {
              return { iso: "", year: "Undated", label: "Undated", rank: Number.MAX_SAFE_INTEGER, sortGroup: 2, kind: "undated" }
            }
            const raw = String(frontmatter?.date ?? "").trim()'''
          if old not in text:
              raise SystemExit('dateText insertion point not found')
          text = text.replace(old, new, 1)
          index_path.write_text(text, encoding='utf-8')

          nav_path = Path('quartz/components/VignetteNavigation.tsx')
          nav = nav_path.read_text(encoding='utf-8')
          old = '''function dateRank(frontmatter: Record<string, any> | undefined) {
            const text = String(frontmatter?.date ?? "").trim()'''
          new = '''function dateRank(frontmatter: Record<string, any> | undefined) {
            if (String(frontmatter?.date_status ?? "").toLowerCase() === "uncertain") return Number.MAX_SAFE_INTEGER
            const text = String(frontmatter?.date ?? "").trim()'''
          if old not in nav:
              raise SystemExit('dateRank insertion point not found')
          nav = nav.replace(old, new, 1)
          nav_path.write_text(nav, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quartz/plugins/transformers/vignetteIndexes.ts quartz/components/VignetteNavigation.tsx
          git commit -m 'Respect uncertain vignette publication dates'
          git push
