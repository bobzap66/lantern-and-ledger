name: Extract Abomination Vaults ornaments

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract optimized ornaments
        run: |
          cd quartz/static/ornaments
          unzip -o abomination-vaults-optimized-ornaments.zip
          rm abomination-vaults-optimized-ornaments.zip
      - name: Commit extracted ornaments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quartz/static/ornaments
          git commit -m "Add optimized Abomination Vaults ornaments" || exit 0
          git push
