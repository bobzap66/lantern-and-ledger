name: Update vignette date support

on:
  push:
    paths:
      - '.github/workflows/update-vignette-date-support.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teach vignette UI about campaign dates
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('quartz/plugins/transformers/vignetteIndexes.ts')
          text = index_path.read_text(encoding='utf-8')
          old = '''function dateText(value: unknown, fallbackPath: string) {
            const raw = String(value ?? "").trim()
            const filenameMatch = path.basename(fallbackPath).match(/^(\\d{4}-\\d{2}-\\d{2})/)
            const iso = /^\\d{4}-\\d{2}-\\d{2}$/.test(raw) ? raw : filenameMatch?.[1] ?? ""
            if (!iso) return { iso: "", year: "Undated", label: "Undated", rank: Number.MAX_SAFE_INTEGER }

            const [year, month, day] = iso.split("-").map(Number)
            const date = new Date(Date.UTC(year, month - 1, day))
            const label = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).format(date)
            return { iso, year: String(year), label, rank: year * 10000 + month * 100 + day }
          }'''
          new = '''function dateText(frontmatter: Record<string, any>, fallbackPath: string) {
            const raw = String(frontmatter?.date ?? "").trim()
            const filenameMatch = path.basename(fallbackPath).match(/^(\\d{4}-\\d{2}-\\d{2})/)
            const iso = /^\\d{4}-\\d{2}-\\d{2}$/.test(raw) ? raw : filenameMatch?.[1] ?? ""
            if (iso) {
              const [year, month, day] = iso.split("-").map(Number)
              const date = new Date(Date.UTC(year, month - 1, day))
              const label = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).format(date)
              return { iso, year: String(year), label, rank: year * 10000 + month * 100 + day, sortGroup: 1, kind: "publication" }
            }

            const golarionMonths = ["Abadius", "Calistril", "Pharast", "Gozran", "Desnus", "Sarenith", "Erastus", "Arodus", "Rova", "Lamashan", "Neth", "Kuthona"]
            const monthNumber = (name: string) => golarionMonths.findIndex((month) => month.toLowerCase() === name.toLowerCase()) + 1
            const campaign = String(frontmatter?.campaign_date_name ?? "").trim()
            const dayMatch = campaign.match(/^(\\d{1,2})\\s+([A-Za-z]+)\\s+(\\d{4})\\s+AR$/)
            const monthMatch = campaign.match(/^([A-Za-z]+)\\s+(\\d{4})\\s+AR$/)

            let year = 0
            let month = 0
            let day = 0
            let label = campaign
            if (dayMatch) {
              day = Number(dayMatch[1])
              month = monthNumber(dayMatch[2])
              year = Number(dayMatch[3])
              label = `${dayMatch[2]} ${day}`
            } else if (monthMatch) {
              month = monthNumber(monthMatch[1])
              year = Number(monthMatch[2])
              label = monthMatch[1]
            }

            if (year && month) {
              return { iso: "", year: `${year} AR`, label, rank: year * 10000 + month * 100 + day, sortGroup: 0, kind: "campaign" }
            }

            return { iso: "", year: "Undated", label: "Undated", rank: Number.MAX_SAFE_INTEGER, sortGroup: 2, kind: "undated" }
          }'''
          if old not in text:
              raise SystemExit('dateText block not found')
          text = text.replace(old, new)
          text = text.replace('.map((note) => ({ note, date: dateText(note.frontmatter?.date, note.relativePath) }))', '.map((note) => ({ note, date: dateText(note.frontmatter, note.relativePath) }))')
          text = text.replace('.sort((a, b) => a.date.rank - b.date.rank || String(a.note.frontmatter?.title ?? "").localeCompare(String(b.note.frontmatter?.title ?? "")))', '.sort((a, b) => a.date.sortGroup - b.date.sortGroup || a.date.rank - b.date.rank || String(a.note.frontmatter?.title ?? "").localeCompare(String(b.note.frontmatter?.title ?? "")))')
          old_range = '''        const firstYear = entries.find((entry) => entry.date.year !== "Undated")?.date.year ?? ""
                  const lastYear = [...entries].reverse().find((entry) => entry.date.year !== "Undated")?.date.year ?? ""
                  const range = firstYear && lastYear ? (firstYear === lastYear ? firstYear : `${firstYear}–${lastYear}`) : ""'''
          new_range = '''        const publishedEntries = entries.filter((entry) => entry.date.kind === "publication")
                  const firstYear = publishedEntries[0]?.date.year ?? ""
                  const lastYear = publishedEntries.at(-1)?.date.year ?? ""
                  const range = firstYear && lastYear ? (firstYear === lastYear ? firstYear : `${firstYear}–${lastYear}`) : ""'''
          if old_range not in text:
              raise SystemExit('range block not found')
          text = text.replace(old_range, new_range)
          index_path.write_text(text, encoding='utf-8')

          nav_path = Path('quartz/components/VignetteNavigation.tsx')
          nav = nav_path.read_text(encoding='utf-8')
          old_rank = '''function dateRank(value: unknown) {
            const text = String(value ?? "").trim()
            if (!text) return 0
            const parsed = Date.parse(text)
            return Number.isFinite(parsed) ? parsed : 0
          }'''
          new_rank = '''function dateRank(frontmatter: Record<string, any> | undefined) {
            const text = String(frontmatter?.date ?? "").trim()
            if (text) {
              const parsed = Date.parse(text)
              if (Number.isFinite(parsed)) return 1_000_000_000_000_000 + parsed
            }

            const months = ["Abadius", "Calistril", "Pharast", "Gozran", "Desnus", "Sarenith", "Erastus", "Arodus", "Rova", "Lamashan", "Neth", "Kuthona"]
            const campaign = String(frontmatter?.campaign_date_name ?? "").trim()
            const dayMatch = campaign.match(/^(\\d{1,2})\\s+([A-Za-z]+)\\s+(\\d{4})\\s+AR$/)
            const monthMatch = campaign.match(/^([A-Za-z]+)\\s+(\\d{4})\\s+AR$/)
            if (dayMatch) {
              const month = months.findIndex((value) => value.toLowerCase() === dayMatch[2].toLowerCase()) + 1
              return Number(dayMatch[3]) * 10000 + month * 100 + Number(dayMatch[1])
            }
            if (monthMatch) {
              const month = months.findIndex((value) => value.toLowerCase() === monthMatch[1].toLowerCase()) + 1
              return Number(monthMatch[2]) * 10000 + month * 100
            }
            return Number.MAX_SAFE_INTEGER
          }'''
          if old_rank not in nav:
              raise SystemExit('dateRank block not found')
          nav = nav.replace(old_rank, new_rank)
          nav = nav.replace('const dateDiff = dateRank(a.frontmatter?.date) - dateRank(b.frontmatter?.date)', 'const dateDiff = dateRank(a.frontmatter) - dateRank(b.frontmatter)')
          nav = nav.replace('const date = String(file.frontmatter?.date ?? "").trim()', 'const date = String(file.frontmatter?.date ?? file.frontmatter?.campaign_date_name ?? "").trim()')
          nav_path.write_text(nav, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quartz/plugins/transformers/vignetteIndexes.ts quartz/components/VignetteNavigation.tsx
          git commit -m 'Support campaign-dated vignettes in archive navigation'
          git push
